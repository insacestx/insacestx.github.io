<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACES AMS | Leads</title>

  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../style-ams.css" />

  <script src="../../global.js" defer></script>
  <script src="../ams.js" defer></script>
  <script src="./leads.js" defer></script>
</head>
<body>
  <header id="aces-header"></header>

  <div class="ams-app">
    <aside class="sidebar">
      <div class="logo">
        <a href="../dashboard/dashboard.html" class="logo-link" aria-label="ACES Home">
          <img src="../../images/image2.png" alt="ACES Insurance Logo" class="aces-logo" />
        </a>
      </div>

      <nav aria-label="AMS navigation">
        <a href="../dashboard/dashboard.html">Dashboard</a>
        <a href="../clients/clients.html">Clients</a>
        <a href="../policies/policies.html">Policies</a>
        <a href="../coi/cois.html">COIs</a>
        <a href="../claims/claims.html">Claims</a>
        <a href="../tasks/tasks.html">Tasks</a>
        <a href="./leads.html" class="active" aria-current="page">Leads</a>
        <a href="../agents/agents.html">Agents</a>
        <a href="../settings/settings.html">Settings</a>
        <a href="#" id="logoutLink" role="button">Logout</a>
      </nav>
    </aside>

    <main class="content" role="main">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
        <h1 style="margin:0;">Leads</h1>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
          <button class="btn-red" type="button" onclick="openLeadEditor()">+ Add Lead</button>
          <button class="btn-red" type="button" onclick="runRoundRobinAssign()">Run Round Robin</button>
        </div>
      </div>

      <section class="client-section" aria-label="Round robin status">
        <h2>Round Robin</h2>
        <p><strong>Last Assigned:</strong> <span id="rrLastAssigned">—</span></p>
        <p><strong>Next Up:</strong> <span id="rrNextUp">—</span></p>
        <p><strong>Queue:</strong> <span id="rrQueue">—</span></p>
      </section>

      <section class="search-bar" aria-label="Search leads">
        <label for="leadSearch" class="sr-only">Search leads</label>
        <input
          id="leadSearch"
          name="leadSearch"
          type="search"
          placeholder="Search name, phone, email, policy, notes..."
          autocomplete="off"
        />
      </section>

      <section class="client-section" aria-label="Lead filters">
        <h2>Filters</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;">
          <div>
            <label for="filterStage">Application Stage</label>
            <select id="filterStage">
              <option value="">All</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="quoted">Quoted</option>
              <option value="application_started">Application Started</option>
              <option value="submitted">Submitted</option>
              <option value="bound">Bound</option>
              <option value="lost">Lost</option>
            </select>
          </div>

          <div>
            <label for="filterAgent">Assigned Email</label>
            <select id="filterAgent">
              <option value="">All</option>
            </select>
          </div>

          <div>
            <label for="filterBind">Policy Status</label>
            <select id="filterBind">
              <option value="">All</option>
              <option value="not-bound">Not Bound</option>
              <option value="bound">Bound</option>
            </select>
          </div>
        </div>
      </section>

      <section aria-label="Leads table">
        <table class="data-table" id="leadsTable">
          <thead>
            <tr>
              <th>Lead ID</th>
              <th>Name</th>
              <th>Contact</th>
              <th>Line</th>
              <th>Assigned Email</th>
              <th>Stage</th>
              <th>Quoted Premium</th>
              <th>Effective Date</th>
              <th>Policy #</th>
              <th>Client Link</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="leadsRows">
            <!-- Rendered by leads.js -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <footer id="aces-footer"></footer>

  <!-- Lead Editor Modal -->
  <dialog id="leadEditorModal" aria-labelledby="leadEditorTitle">
    <form method="dialog" id="leadEditorForm">
      <h2 id="leadEditorTitle">Lead Editor</h2>
      <input type="hidden" id="leadId" />

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem;">
        <div>
          <label for="leadFirstName">First Name</label>
          <input id="leadFirstName" type="text" required />
        </div>

        <div>
          <label for="leadLastName">Last Name</label>
          <input id="leadLastName" type="text" required />
        </div>

        <div>
          <label for="leadEmail">Email</label>
          <input id="leadEmail" type="email" />
        </div>

        <div>
          <label for="leadPhone">Phone</label>
          <input id="leadPhone" type="tel" />
        </div>

        <div>
          <label for="leadLine">Line of Business</label>
          <select id="leadLine">
            <option value="Auto">Auto</option>
            <option value="Home">Home</option>
            <option value="Commercial">Commercial</option>
            <option value="Life">Life</option>
            <option value="Umbrella">Umbrella</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label for="leadAssignedAgent">Assigned Email</label>
          <select id="leadAssignedAgent"></select>
        </div>

        <!-- leads.js will also ensure this exists dynamically; included here for clarity -->
        <div>
          <label for="leadLanguage">Language</label>
          <select id="leadLanguage">
            <option value="en">EN</option>
            <option value="es">ES</option>
          </select>
        </div>

        <div>
          <label for="leadStage">Application Stage</label>
          <select id="leadStage">
            <option value="New">New</option>
            <option value="Contacted">Contacted</option>
            <option value="Quoted">Quoted</option>
            <option value="Application Started">Application Started</option>
            <option value="Submitted">Submitted</option>
            <option value="Bound">Bound</option>
            <option value="Lost">Lost</option>
          </select>
        </div>

        <div>
          <label for="leadQuotedPremium">Quoted Premium</label>
          <input id="leadQuotedPremium" type="number" min="0" step="0.01" placeholder="0.00" />
        </div>

        <div>
          <label for="leadCarrier">Carrier</label>
          <input id="leadCarrier" type="text" />
        </div>

        <div>
          <label for="leadEffectiveDate">Effective Date</label>
          <input id="leadEffectiveDate" type="date" />
        </div>

        <div>
          <label for="leadPolicyNumber">Policy Number</label>
          <input id="leadPolicyNumber" type="text" />
        </div>

        <div>
          <label for="leadAppStartedDate">Application Started</label>
          <input id="leadAppStartedDate" type="date" />
        </div>

        <div>
          <label for="leadSubmittedDate">Submitted Date</label>
          <input id="leadSubmittedDate" type="date" />
        </div>
      </div>

      <div style="margin-top:.75rem;">
        <label for="leadNotes">Notes</label>
        <textarea id="leadNotes" rows="4" placeholder="Add lead notes..."></textarea>
      </div>

      <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap;">
        <button type="button" onclick="closeLeadEditor()">Cancel</button>
        <button class="btn-red" type="button" onclick="saveLead()">Save Lead</button>
      </div>
    </form>
  </dialog>
</body>
</html>
