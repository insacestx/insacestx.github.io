<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title
    data-en="Auto Insurance Application"
    data-es="Solicitud de Seguro de Auto">
    Auto Insurance Application
  </title>

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/wizard.css">

  <script src="/global.js" defer></script>
  <script src="/wizard.js" defer></script>
</head>

<body>

<header id="aces-header"></header>

<main class="fade-in">

  <section class="auto-hero">
    <div class="auto-hero-inner">

      <img
        src="/images/hero-wizard-application.png"
        alt="Auto Insurance Application"
        class="hero-wizard-application"
      />

      <div id="wizard-tabs"></div>

    </div>
  </section>

  <section class="auto-app-wrapper">
    <div class="auto-app-card">

      <div id="wizard-container"></div>

      <div class="wizard-progress-bar">
        <div id="wizard-progress"></div>
      </div>

    </div>
  </section>

</main>

<footer id="aces-footer"></footer>

</body>
</html>
